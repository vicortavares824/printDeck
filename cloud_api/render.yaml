# render.yaml - Configuração de deploy no Render
# Docss: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: printdeck-cloud-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: printdeck-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: API_SECRET_KEY
        value: printdeck-secret-token
      - key: DEBUG
        value: "false"

databases:
  - name: printdeck-db
    databaseName: printdeck
    user: printdeck_user
    plan: free
